    value: springboards-community-dev
  - variable: FIRESTORE_DATABASE_ID
    value: ai-studio-springboardsland-71046992-4c5a-4c20-bdcd-c5ee24b8cc0a
  - variable: ALLOWED_ORIGINS
    value: https://springboardsfcd.org,https://www.springboardsfcd.org,https://springboards-community-dev.web.app,https://springboards-community-dev.firebaseapp.com
  - variable: DESIGNATED_INBOX
    value: marilynnlward@gmail.com
  - variable: HR_INBOX
    value: marilynnlward@gmail.com
  - variable: ALERT_EMAIL
    value: marilynnlward@gmail.com
  - variable: BACKUP_ALERT_EMAIL
    value: marilynnlward@gmail.com
  - variable: WORKSPACE_CONNECTED_EMAIL
    value: marilynnlward@gmail.com
  - variable: ADMIN_ALLOWED_EMAILS
