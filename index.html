<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Springboards - Launch your ideas, mission, and community forward.">
  <title>Springboards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header Section -->
  <header class="site-header">
    <!-- Far Left: Oversized Springboards Logo -->
    <div class="header-left">

    <nav class="header-nav" aria-label="Main Navigation">
      <ul class="nav-list">
        <li><a href="#mission" class="nav-link" id="nav-mission">Mission</a></li>
        <li><a href="#training" class="nav-link" id="nav-training">Training</a></li>

    <div class="header-right">
      <a href="#join-us" class="btn btn-join" id="btn-join-us">Join Us</a>
    </div>
  </header>

  <!-- Main Content Framework -->
  <main class="site-main">
    <section class="hero-section">
      <h1 class="hero-title">Welcome to <span>Springboards</span></h1>
      <p class="hero-subtitle">
        Elevate your skills, connect with a vibrant community, and achieve your mission.

  <footer class="site-footer">
