name: Deploy to Firebase App Hosting & Hosting (Node 24)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_ENV: production
  FIREBASE_PROJECT_ID: springboards-community-dev
  APPHOSTING_BACKEND_ID: springboards-backend
  APPHOSTING_REGION: us-east4

jobs:
  deploy-production:
    name: Validate & Deploy on Node 24
    # Node 24 compatible x64 runner (avoids deprecated Node 20, macOS <= 13.4, and ARM32)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Springboards Node 24 QA Gate Action
        uses: ./.github/actions/springboards-qa-gate
        with:
          base-url: "http://127.0.0.1:3000"

      - name: Deploy to Firebase Hosting
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT != '' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: springboards-community-dev
