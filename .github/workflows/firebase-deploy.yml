name: Deploy to Firebase App Hosting & Hosting (Node 24)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_ENV: production
  FIREBASE_PROJECT_ID: springboards-community-dev
  APPHOSTING_BACKEND_ID: springboards-backend
  APPHOSTING_REGION: us-east4

jobs:
  deploy-production:
    name: Validate & Deploy on Node 24
    # Node 24 compatible x64 runner (avoids deprecated Node 20, macOS <= 13.4, and ARM32)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Springboards Node 24 QA Gate Action
        uses: ./.github/actions/springboards-qa-gate
        with:
          base-url: "http://127.0.0.1:3000"

      - name: Check Firebase deployment credentials
        id: firebase-credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FIREBASE_SERVICE_ACCOUNT is not configured; deployments will be skipped."
          fi

      - name: Deploy Firebase App Hosting rollout
        if: ${{ steps.firebase-credentials.outputs.available == 'true' }}
        env:
          APPHOSTING_BACKEND_ID: ${{ env.APPHOSTING_BACKEND_ID }}
          FIREBASE_PROJECT_ID: ${{ env.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          npx --yes firebase-tools@latest apphosting:rollouts:create "$APPHOSTING_BACKEND_ID" \
            --git-commit "$GITHUB_SHA" \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive

      - name: Deploy to Firebase Hosting
        if: ${{ steps.firebase-credentials.outputs.available == 'true' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: springboards-community-dev
