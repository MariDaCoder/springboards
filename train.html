    <link rel="stylesheet" href="/styles.css">
    <style>
      :root {
        --train-page-bg: #f8fafc;
        --train-page-panel: #ffffff;
        --train-page-border: rgba(148, 163, 184, 0.35);
      }

      body {
        min-height: 100vh;
        margin: 0;
        background: #f8fafc;
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      .prequal-shell {
        display: flex;
        flex-direction: column;
        max-width: 1200px;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0 auto;
        padding: clamp(1rem, 3vw, 2.25rem);
      }

      .prequal-back-link {
        align-self: flex-start;
        color: var(--primary-navy, #0b192c);
        font-weight: 700;
        text-decoration: none;
        margin-bottom: 0.5rem;
      }

      .prequal-back-link:hover,
      .prequal-back-link:focus-visible {
        color: var(--accent-orange, #e05b32);
        text-decoration: underline;
        text-underline-offset: 0.2em;
      }

      .prequal-content {
        display: flex;
        flex: 1;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(1rem, 2.5vh, 1.75rem);
        padding: 0.5rem 0 2rem;
        text-align: center;
      }

      .prequal-deck-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 1040px;
      }

      .prequal-heading {
        margin: 0;
        color: var(--primary-navy, #0b192c);
        font-size: clamp(1.7rem, 3.5vw, 2.75rem);
        line-height: 1.15;
        letter-spacing: -0.025em;
      }

      .prequal-intro-copy {
        margin: 0 0 1.25rem;
        color: var(--text-muted, #64748b);
        font-size: clamp(0.95rem, 1.5vw, 1.1rem);
      }

      .prequal-slide-frame {
        width: 100%;
        position: relative;
        overflow: hidden;
        border: 1.5px solid #cbd5e1;
        border-radius: 12px;
        background: #0b192c;
        box-shadow: 0 2px 6px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
      }

      .prequal-slide-toggle {
        position: relative;
        display: block;
        width: 100%;
        padding: 0;
        border: 0;
        background: transparent;
        color: #ffffff;
        cursor: pointer;
        touch-action: manipulation;
      }

      .prequal-slide-toggle:focus-visible {
        outline: 4px solid #f59e0b;
        outline-offset: -5px;
      }

      .prequal-slide {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: contain;
      }

      .prequal-slide-control {
        position: absolute;
        top: 50%;
        left: 50%;
        display: grid;
        width: clamp(3.5rem, 9vw, 5.5rem);
        aspect-ratio: 1;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.75);
        border-radius: 50%;
        background: rgba(15, 23, 42, 0.3);
        color: #ffffff;
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, -50%);
        transition: opacity 0.2s ease;
        backdrop-filter: blur(5px);
      }

      .prequal-slide-control svg {
        width: 42%;
        height: 42%;
        fill: currentColor;
      }

      .prequal-slide-toggle[data-playing="false"] .prequal-play-control {
        opacity: 0.95;
      }

      .prequal-slide-toggle[data-playing="true"]:hover .prequal-pause-control,
      .prequal-slide-toggle[data-playing="true"]:focus-visible .prequal-pause-control {
        opacity: 0.95;
      }

      @media (hover: none) {
        .prequal-slide-toggle[data-playing="true"] .prequal-pause-control {
          opacity: 0.8;
        }
      }

      .prequal-actions {
        display: flex;
        min-height: 6rem;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 0.85rem;
        margin-top: 1.5rem;
      }

      .prequal-yes {
        display: inline-flex;
        min-height: 3.25rem;
        align-items: center;
        justify-content: center;
        padding: 0.85rem 1.75rem;
        border: 2px solid #166534;
        border-radius: var(--radius-md, 0.75rem);
        background: #15803d;
        box-shadow: 0 8px 20px rgba(21, 128, 61, 0.22);
        color: #ffffff;
        font-size: 1.05rem;
        font-weight: 800;
        text-decoration: none;
        cursor: pointer;
        transition: background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
      }

      .prequal-yes:hover,
      .prequal-yes:focus-visible {
        transform: translateY(-2px);
        background: #166534;
        box-shadow: 0 10px 24px rgba(21, 128, 61, 0.28);
      }

      .prequal-no {
        color: #b91c1c;
        font-weight: 700;
        text-decoration: underline;
        text-underline-offset: 0.2em;
        cursor: pointer;
      }

      .prequal-no:hover,
      .prequal-no:focus-visible {
        color: #7f1d1d;
      }

      @media (max-width: 600px) {
        .prequal-shell {
          padding: 1rem;
        }
        .prequal-content {
          padding-top: 4vh;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .prequal-yes {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <main class="prequal-shell" id="main-content" tabindex="-1">
      <a class="prequal-back-link" href="/#our-programs">← Back to programs</a>
      <section class="prequal-content prequal-screen" id="screenIntroDeck" aria-labelledby="prequalTitle">
        <p class="section-eyebrow">TRANSITIONAL JOBS</p>
        <h1 class="prequal-heading" id="prequalTitle">Your next step starts here.</h1>
        <p class="prequal-intro-copy">Watch this short introduction before starting pre-qualification.</p>

        <div class="prequal-deck-container">
          <div class="prequal-slide-frame">
            <button class="prequal-slide-toggle" id="prequalSlideToggle" type="button" data-playing="false" aria-label="Play introduction" aria-pressed="false">
              <img
                class="prequal-slide"
                id="prequalSlide"
                src="/slides/slide-1.svg"
                alt="Transitional Jobs introduction, slide 1 of 10"
                width="1707"
                height="960"
                fetchpriority="high"
              >
              <span class="prequal-slide-control prequal-play-control" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
              </span>
              <span class="prequal-slide-control prequal-pause-control" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"></path></svg>
              </span>
            </button>
          </div>

          <div class="prequal-actions" aria-live="polite">
            <button class="prequal-yes" id="btnStartWizardFromDeck" type="button">Yes: Get Pre Qualified!</button>
            <a class="prequal-no" id="btnDeckNotReady" href="/#our-programs">No: Not Ready Yet.</a>
          </div>
          <div style="margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted, #64748b); display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem;">
            <a href="/" style="color: var(--primary-navy, #0b192c); font-weight: 700;">Home</a>
            <span>&bull;</span>
            <a href="/eligibility" style="color: var(--primary-navy, #0b192c); font-weight: 700;">Eligibility Check</a>
            <span>&bull;</span>
            <a href="tel:+16156031157" style="color: var(--primary-navy, #0b192c); font-weight: 700;">Call 615-603-1157</a>
            <span>&bull;</span>
            <a href="mailto:info@springboardsfcd.org" style="color: var(--primary-navy, #0b192c); font-weight: 700;">Email info@springboardsfcd.org</a>
          </div>
        </div>
      </section>
    </main>

    <script src="/analytics.js" defer></script>
    <script>
      (() => {
        const slide = document.getElementById("prequalSlide");
        const slideToggle = document.getElementById("prequalSlideToggle");
        const startWizardBtn = document.getElementById("btnStartWizardFromDeck");

        if (!slide || !slideToggle || !startWizardBtn) return;

        const slides = Array.from({ length: 10 }, (_, index) => `/slides/slide-${index + 1}.svg`);
        slides.slice(1).forEach((src) => {
          const image = new Image();
          image.src = src;
        });

        let currentSlide = 0;
        let playbackTimer = null;
        let isPlaying = false;

        const updatePlaybackControl = () => {
          slideToggle.dataset.playing = String(isPlaying);
          slideToggle.setAttribute("aria-pressed", String(isPlaying));
          slideToggle.setAttribute("aria-label", isPlaying ? "Pause introduction" : "Play introduction");
        };

        const stopPlayback = () => {
          isPlaying = false;
          if (playbackTimer !== null) {
            window.clearTimeout(playbackTimer);
            playbackTimer = null;
          }
          updatePlaybackControl();
        };

        const advanceIntro = () => {
          playbackTimer = null;
          if (!isPlaying) return;
          if (currentSlide === slides.length - 1) {
            stopPlayback();
            return;
          }

          currentSlide += 1;
          slide.src = slides[currentSlide];
          slide.alt = `Transitional Jobs introduction, slide ${currentSlide + 1} of ${slides.length}`;
          playbackTimer = window.setTimeout(advanceIntro, 3000);
        };

        const startPlayback = () => {
          if (currentSlide === slides.length - 1) {
            currentSlide = 0;
            slide.src = slides[currentSlide];
          }
          isPlaying = true;
          updatePlaybackControl();
          playbackTimer = window.setTimeout(advanceIntro, 3000);
        };

        slideToggle.addEventListener("click", () => {
          if (isPlaying) {
            stopPlayback();
          } else {
            startPlayback();
          }
        });

        startWizardBtn.addEventListener("click", () => {
          stopPlayback();
          window.location.assign("/eligibility");
        });
      })();
    </script>
  </body>
